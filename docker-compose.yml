version: '3.8'

services:
  # 1. MongoDB Production Persistence Store
  mongodb:
    image: mongo:7.0
    container_name: netshield-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-netshield_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-SuperSecretMongoPassword2026!}
    volumes:
      - mongodb_data:/data/db
    networks:
      - netshield-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Python FastAPI Production ML Microservice
  ml-service:
    build:
      context: .
      dockerfile: ml_service/Dockerfile
    container_name: netshield-ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      WORKERS: 1
      LOG_LEVEL: info
      CORS_ORIGINS: "http://localhost:5000,http://localhost:5173,http://127.0.0.1:5000,http://127.0.0.1:5173,http://backend:5000"
    networks:
      - netshield-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 3. Node.js Express Production Backend Microservice
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netshield-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      LOG_LEVEL: info
      MONGODB_URI: ${MONGODB_URI:-mongodb://netshield_admin:SuperSecretMongoPassword2026!@mongodb:27017/netshield_db?authSource=admin}
      ML_SERVICE_URL: http://ml-service:8000
      ML_SERVICE_TIMEOUT_MS: 10000
      JWT_SECRET: ${JWT_SECRET:-netshield_production_jwt_secret_key_change_me_2026}
      JWT_EXPIRES_IN: 1h
      COOKIE_NAME: netshield_token
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:5000,http://frontend:5173"
      AUTH_RATE_LIMIT_WINDOW_MS: 900000
      AUTH_RATE_LIMIT_MAX: 10
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@netshield.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminSecurePassword123!}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-sysadmin}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM}
      SENSOR_SERVICE_TOKEN: ${SENSOR_SERVICE_TOKEN:-netshield_sensor_internal_service_token_phase20_11_secure}
    networks:
      - netshield-network
    depends_on:
      mongodb:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 4. React SOC Dashboard Nginx Web Container
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netshield-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    networks:
      - netshield-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:5173/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # 5. Network Sensor PCAP & Flow Microservice
  sensor:
    build:
      context: .
      dockerfile: sensor/Dockerfile
    container_name: netshield-sensor
    restart: unless-stopped
    environment:
      SENSOR_MODE: pcap
      PCAP_FILE: sensor/samples/sample_test.pcap
      DATASET_TYPE: nsl_kdd
      BACKEND_URL: http://backend:5000
      ML_SERVICE_URL: http://ml-service:8000
      SENSOR_SERVICE_TOKEN: ${SENSOR_SERVICE_TOKEN:-netshield_sensor_internal_service_token_phase20_11_secure}
    networks:
      - netshield-network
    depends_on:
      backend:
        condition: service_healthy

networks:
  netshield-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
